<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email confirmed — FreiPark</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .check {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        background: #dbeafe;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        color: #475569;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a.button {
        display: inline-block;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 8px;
      }
      a.button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="check">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path d="M5 13l4 4L19 7" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>Your email is confirmed</h1>
      <p>You're all set — open the FreiPark app to sign in. If you don't have it installed yet, join the waitlist and we'll let you know the moment it's available.</p>
      <a class="button" href="https://freipark.com/#waitlist">Back to FreiPark</a>
    </div>
  </body>
</html>
